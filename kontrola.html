<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js"></script>
<title>Kontrola — TD Consulting Group</title>
<style>
  :root{--brand-navy:#1B3F7F;--brand-navy-dark:#15315F;--brand-green:#1FA84B;--brand-tint:#EEF3F9;}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f8fb;color:#111;line-height:1.5}
  main{max-width:1100px;margin:0 auto;padding:36px 20px 96px}
  .back{display:inline-block;margin-bottom:14px;font-size:14px;color:#666;text-decoration:none}
  .brand{text-align:center;margin:0 0 14px}.brand img{height:60px}
  h1{font-size:23px;font-weight:700;margin:0 0 6px;color:var(--brand-navy);text-align:center}
  .lead{color:#666;margin:0 auto 20px;font-size:14px;text-align:center;max-width:760px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:0 0 18px}
  .tile{background:#fff;border:1.5px solid #e5e9ef;border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tile:hover{border-color:var(--brand-navy)}
  .tile.on{border-color:var(--brand-navy);box-shadow:0 0 0 3px rgba(27,63,127,.12)}
  .tile b{display:block;font-size:30px;line-height:1.1;color:var(--brand-navy)}
  .tile span{display:block;font-size:13px;color:#5a6577;margin-top:4px}
  .tile.red b{color:#b91c1c}.tile.amber b{color:#b45309}.tile.green b{color:#166534}
  .tile.zero b{color:#9aa6b8}
  .box{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:6px 16px 14px}
  .box h2{font-size:15px;margin:14px 0 4px;color:var(--brand-navy)}
  .hint{color:#7a8699;font-size:12.5px;margin:0 0 10px}
  .tablewrap{overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:9px 10px;border-bottom:1px solid #eef1f6;text-align:left}
  th{color:#5a6577;font-weight:600;font-size:12.5px;white-space:nowrap}
  .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-red{background:#fee2e2;color:#991b1b}.p-amber{background:#fef3c7;color:#92400e}.p-ok{background:#dcfce7;color:#166534}.p-grey{background:#eef1f6;color:#5a6577}
  .empty{text-align:center;color:#888;padding:28px}
  a.tl{color:var(--brand-navy);text-decoration:none;font-weight:600}
  .search{display:block;width:100%;max-width:360px;margin:10px 0;padding:9px 12px;border:1px solid #d4dbe6;border-radius:9px;font:inherit;font-size:14px}
</style>
</head>
<body>
<main>
  <a href="index.html" class="back">← Powrót do portalu</a>
  <div class="brand"><img src="logo.png" alt="TD Consulting Group" /></div>
  <h1>Kontrola</h1>
  <p class="lead">Co wymaga uwagi działu kadr: nowe zgłoszenia, kończące się dokumenty i umowy, braki w danych. Kliknij kafelek, aby zobaczyć listę.</p>

  <div class="tiles" id="tiles"><div class="empty">Ładowanie…</div></div>

  <div class="box">
    <h2 id="listTitle"></h2>
    <p class="hint" id="listHint"></p>
    <input type="search" id="q" class="search" placeholder="Szukaj: pracownik, firma…" />
    <div class="tablewrap"><table id="list"></table></div>
  </div>
</main>
<script src="kontrola.js"></script>
</body>
</html>
