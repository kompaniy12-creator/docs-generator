<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-guard.js"></script>
<title>Onboarding klientów — TD Consulting Group</title>
<style>
  :root{--brand-navy:#1B3F7F}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f8fb;color:#111}
  /* the onboarding app fills everything the portal shell leaves free */
  main#onb{max-width:none;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
  body.ps main#onb{max-width:none;margin:0;padding:0;height:calc(100vh - 56px);display:flex;flex-direction:column}
  @media (max-width:900px){body.ps main#onb{height:calc(100vh - 54px - 64px);padding:0}}
  #onbBar{display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px;color:#5a6577;background:#fff;border-bottom:1px solid #e1e7f0}
  #onbBar b{color:var(--brand-navy);font-size:14px}
  #onbBar a{margin-left:auto;color:var(--brand-navy);text-decoration:none;font-weight:600;white-space:nowrap}
  #onbFrame{flex:1;width:100%;border:0;background:#fff}
  #onbMsg{padding:40px 20px;text-align:center;color:#666}
</style>
</head>
<body>
<main id="onb">
  <div id="onbBar"><b>Onboarding klientów</b><span id="onbState">Łączenie…</span><a id="onbOpen" href="#" target="_blank" rel="noopener">Otwórz w nowej karcie ↗</a></div>
  <iframe id="onbFrame" name="onbFrame" title="Onboarding klientów" allow="clipboard-write"></iframe>
  <form id="onbSso" method="post" target="onbFrame" hidden>
    <input type="hidden" name="token" /><input type="hidden" name="next" />
  </form>
</main>
<script src="onboarding.js"></script>
</body>
</html>
